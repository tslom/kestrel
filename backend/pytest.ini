[pytest]
# Run from backend/: `source .venv/bin/activate && pytest`
pythonpath = .
testpaths = tests
# Starlette's TestClient warns that pairing it with httpx is deprecated in
# favour of httpx2 — third-party, nothing for us to fix, so silence just that
# one category to keep the run output clean.
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
